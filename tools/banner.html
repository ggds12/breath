<!doctype html>
<!-- Banner do README. Renderizado com o Edge headless (veja tools/README.md). -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("../web/assets/fonts/Inter-variable.ttf"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("../web/assets/fonts/JetBrainsMono-Regular.ttf"); }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 440px; overflow: hidden; position: relative;
    background: #0B0D10; color: #F2F6F4; font-family: "Inter", sans-serif;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); }
  .g1 { width: 620px; height: 620px; left: -160px; top: -300px; background: rgba(52, 211, 180, .30); }
  .g2 { width: 700px; height: 700px; right: -220px; bottom: -420px; background: rgba(48, 84, 170, .42); }
  .wrap { position: relative; display: flex; align-items: center; height: 100%; padding: 0 88px; gap: 40px; }
  .sym { width: 168px; height: 168px; flex: none; filter: drop-shadow(0 18px 40px rgba(52, 211, 180, .28)); }
  h1 { margin: 0; font-size: 104px; font-weight: 750; letter-spacing: -.05em; line-height: .9; }
  p { margin: 18px 0 0; font-size: 25px; color: rgba(242, 246, 244, .70); max-width: 560px; line-height: 1.35; }
  .tag { margin-top: 22px; font: 400 15px "JetBrains Mono", monospace; color: #5EEAD4; letter-spacing: .08em; text-transform: uppercase; }
  .puffs { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, 120px); gap: 18px 26px; }
  .puffs img { width: 120px; height: 120px; }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="wrap">
    <img class="sym" src="../web/assets/symbol.svg" alt="">
    <div>
      <h1>breath</h1>
      <p>Quanto fôlego ainda resta no seu Claude e no seu Codex.</p>
      <div class="tag">limites de 5h e semana · 100% local</div>
    </div>
  </div>
  <div class="puffs">
    <img src="../web/assets/mascot/pronto-branco.svg" alt="">
    <img src="../web/assets/mascot/sucesso-branco.svg" alt="">
    <img src="../web/assets/mascot/atencao-branco.svg" alt="">
    <img src="../web/assets/mascot/erro-branco.svg" alt="">
  </div>
</body>
</html>
