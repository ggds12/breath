<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <title>Breath</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

  <button class="close mini-only" id="close" type="button" title="Fechar (Esc)" aria-label="Fechar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
  </button>

  <div class="scene" id="scene">
    <div class="widget" id="widget">

      <header class="head layer" data-depth="34">
        <div class="mascot" id="mascot" aria-hidden="true">
          <div class="mascot-glow"></div>
          <img class="mascot-img" id="mascot-a" alt="" width="64" height="64">
          <img class="mascot-img" id="mascot-b" alt="" width="64" height="64">
          <div class="mascot-shadow"></div>
        </div>
        <div class="head-copy" aria-live="polite">
          <p class="eyebrow" id="eyebrow">Buscando</p>
          <h1 id="headline">Lendo seus limites…</h1>
          <p class="sub" id="sub">Claude e Codex, direto da sua máquina.</p>
        </div>
      </header>

      <main class="providers" id="providers"></main>

      <footer class="foot layer" data-depth="10">
        <div class="tools">
          <button class="tool add" id="add" type="button" title="Adicionar conta (A)" aria-label="Adicionar conta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="tool" id="refresh" type="button" title="Atualizar (R)" aria-label="Atualizar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
          </button>
          <button class="tool" id="theme" type="button" title="Tema claro/escuro (T)" aria-label="Alternar tema">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
          </button>
          <button class="tool mini-only" id="pin" type="button" aria-pressed="false"
                  title="Fixar: não fecha ao clicar fora (F)" aria-label="Fixar janela">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 4 3v2H6v-2l4-3zM12 14v7"/></svg>
          </button>
          <a class="tool mini-only" id="expand" href="/" target="_blank" rel="noopener"
             title="Abrir no navegador" aria-label="Abrir no navegador">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          </a>
        </div>
        <span class="stamp" id="stamp"><i class="dot"></i><span id="stamp-text">conectando</span></span>
      </footer>

      <section class="sheet" id="sheet" hidden aria-labelledby="sheet-title">
        <header class="sheet-head">
          <h2 id="sheet-title">Adicionar conta</h2>
          <button class="tool" id="sheet-close" type="button" title="Fechar (Esc)" aria-label="Fechar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </header>
        <form id="add-form" autocomplete="off" novalidate>
          <label class="fld">Serviço
            <select name="tipo" id="f-tipo">
              <option value="claude">Claude · outra conta (pasta de login)</option>
              <option value="codex">Codex · outra conta (pasta de login)</option>
              <option value="openrouter">OpenRouter · Gemini, Grok, DeepSeek, Llama…</option>
              <option value="deepseek">DeepSeek · saldo</option>
              <option value="kimi">Kimi (Moonshot) · saldo</option>
              <option value="custom">Outra IA · personalizada</option>
            </select>
          </label>
          <label class="fld">Nome do cartão <input name="nome" maxlength="40" placeholder="Ex.: Trabalho"></label>
          <label class="fld" data-show="claude codex">Pasta do login <input name="pasta" maxlength="500" placeholder="Ex.: C:\Users\voce\.claude-trabalho"></label>
          <label class="fld" data-show="custom">Endereço de uso (https) <input name="url" maxlength="500" placeholder="https://api.exemplo.com/v1/balance"></label>
          <label class="fld" data-show="openrouter deepseek kimi custom">Chave de API <input name="chave" type="password" maxlength="512" autocomplete="new-password" spellcheck="false"></label>
          <div class="row2" data-show="custom">
            <label class="fld">Cabeçalho <input name="cabecalho" maxlength="80" placeholder="Authorization"></label>
            <label class="fld">Prefixo <input name="prefixo" maxlength="80" placeholder="Bearer "></label>
          </div>
          <div class="row2" data-show="custom">
            <label class="fld">Campo usado <input name="campo_usado" maxlength="80" placeholder="data.used"></label>
            <label class="fld">Campo limite <input name="campo_limite" maxlength="80" placeholder="data.limit"></label>
          </div>
          <label class="fld" data-show="custom">…ou campo de saldo <input name="campo_saldo" maxlength="80" placeholder="data.balance"></label>
          <div class="row2" data-show="openrouter deepseek kimi custom">
            <label class="fld">Orçamento (opcional) <input name="orcamento" inputmode="decimal" maxlength="12" placeholder="Ex.: 20"></label>
            <label class="fld" data-show="kimi">Região
              <select name="regiao"><option value="">Global (.ai)</option><option value="cn">China (.cn)</option></select>
            </label>
            <label class="fld" data-show="custom">Moeda <input name="moeda" maxlength="8" placeholder="USD"></label>
          </div>
          <p class="sheet-note" id="f-note"></p>
          <p class="sheet-err" id="f-err" role="alert"></p>
          <button class="primary" type="submit" id="f-submit">Adicionar</button>
        </form>
      </section>
    </div>
  </div>

  <p class="privacy full-only">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>
    100% local em 127.0.0.1 · chaves e tokens nunca chegam ao navegador · rede só para os serviços das suas contas
  </p>

  <template id="tpl-provider">
    <section class="card layer" data-depth="18">
      <div class="card-sheen" aria-hidden="true"></div>
      <header class="card-head">
        <span class="p-name"></span>
        <span class="p-plan"></span>
        <span class="p-live"></span>
        <button class="p-remove" type="button" title="Remover esta conta" aria-label="Remover esta conta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </header>
      <p class="p-msg"></p>
      <div class="rings"></div>
      <div class="extras"></div>
    </section>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
