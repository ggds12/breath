<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-18 -24 100 100" role="img" aria-labelledby="title"><title id="title">Logo Concluído — Salto</title><style>g,ellipse{transform-box:view-box;transform-origin:0 0}.lift{animation:lift 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes lift{0%{transform:translate(0px,0px);}15%{transform:translate(0px,0px);}29%{transform:translate(0px,-18px);}40%{transform:translate(0px,-20px);}58%{transform:translate(0px,0px);}100%{transform:translate(0px,0px);}}.hat{animation:hat 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes hat{0%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}18%{transform:translate(0px,1px) translate(32px,20px) rotate(3deg) translate(-32px,-20px);}30%{transform:translate(0px,-2px) translate(32px,20px) rotate(-7deg) translate(-32px,-20px);}48%{transform:translate(0px,-3px) translate(32px,20px) rotate(-2deg) translate(-32px,-20px);}61%{transform:translate(0px,1px) translate(32px,20px) rotate(4deg) translate(-32px,-20px);}78%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}100%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}}.left{animation:left 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes left{0%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}38%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}41%{transform:translate(19.5px,31.5px) scale(1,0.06) translate(-19.5px,-31.5px);}44%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}100%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}}.right{animation:right 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes right{0%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}38%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}41%{transform:translate(29px,34.2px) scale(1,0.06) translate(-29px,-34.2px);}44%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}100%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}}.squash{animation:squash 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes squash{0%{transform:translate(32px,61.5px) scale(1,1) translate(-32px,-61.5px);}10%{transform:translate(32px,61.5px) scale(1,1) translate(-32px,-61.5px);}18%{transform:translate(32px,61.5px) scale(1.15,0.8) translate(-32px,-61.5px);}25%{transform:translate(32px,61.5px) scale(0.88,1.13) translate(-32px,-61.5px);}38%{transform:translate(32px,61.5px) scale(1,1) translate(-32px,-61.5px);}54%{transform:translate(32px,61.5px) scale(0.94,1.05) translate(-32px,-61.5px);}60%{transform:translate(32px,61.5px) scale(1.18,0.79) translate(-32px,-61.5px);}68%{transform:translate(32px,61.5px) scale(0.96,1.05) translate(-32px,-61.5px);}77%{transform:translate(32px,61.5px) scale(1,1) translate(-32px,-61.5px);}100%{transform:translate(32px,61.5px) scale(1,1) translate(-32px,-61.5px);}}.shadow{animation:shadow 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes shadow{0%{transform:translate(32px,65px) scale(1,1) translate(-32px,-65px);opacity:0.1;}18%{transform:translate(32px,65px) scale(1.08,1.08) translate(-32px,-65px);opacity:0.13;}36%{transform:translate(32px,65px) scale(0.55,0.55) translate(-32px,-65px);opacity:0.035;}58%{transform:translate(32px,65px) scale(1.1,1.1) translate(-32px,-65px);opacity:0.14;}77%{transform:translate(32px,65px) scale(1,1) translate(-32px,-65px);opacity:0.1;}100%{transform:translate(32px,65px) scale(1,1) translate(-32px,-65px);opacity:0.1;}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.particles,.halo{opacity:0!important}}</style><g class="halo" transform="translate(32,35) scale(1,1) translate(-32,-35)" opacity="0"><circle cx="32" cy="35" r="32" fill="none" stroke="#E99532" stroke-width=".45"/></g><g fill="#E99532"></g><g class="whole" opacity="1"><g class="lift" transform="translate(0,0)"><g class="spin" transform="translate(32,35) rotate(0) translate(-32,-35)"><g class="squash" transform="translate(32,61.5) scale(1,1) translate(-32,-61.5)" fill="#FFFFFF"><g class="body" transform="translate(0,0)" opacity="1"><path fill-rule="evenodd" d="M10 35C10 39.7 19.8 43.5 32 43.5S54 39.7 54 35V53C54 57.7 44.2 61.5 32 61.5S10 57.7 10 53ZM10 46.5C10 51.2 19.8 55 32 55S54 51.2 54 46.5V49.5C54 54.2 44.2 58 32 58S10 54.2 10 49.5Z"/></g><g class="hat" transform="translate(0,0) translate(32,20) rotate(0) translate(-32,-20)"><ellipse cx="31" cy="29" rx="24" ry="8.2" transform="rotate(24 55 32)"/></g><g class="eyes" transform="translate(0,0)"><g class="left" transform="translate(19.5,31.5) scale(1,1) translate(-19.5,-31.5)"><ellipse cx="19.5" cy="31.5" rx="3.2" ry="4.4"/></g><g class="right" transform="translate(29,34.2) scale(1,1) translate(-29,-34.2)"><ellipse cx="29" cy="34.2" rx="3.2" ry="4.4"/></g></g></g></g></g></g><g transform="translate(59,52)"><circle r="6.5" fill="#276B47"/><g stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m-3 0 2 2 4-4"/></g></g></svg>