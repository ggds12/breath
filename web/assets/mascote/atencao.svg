<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-18 -24 100 100" role="img" aria-labelledby="title"><title id="title">Logo Atenção — Saudação</title><style>g,ellipse{transform-box:view-box;transform-origin:0 0}.lift{animation:lift 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes lift{0%{transform:translate(0px,0px);}40%{transform:translate(0px,-0.8px);}100%{transform:translate(0px,0px);}}.hat{animation:hat 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes hat{0%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}14%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}28%{transform:translate(3px,-7px) translate(32px,20px) rotate(15deg) translate(-32px,-20px);}44%{transform:translate(3px,-7px) translate(32px,20px) rotate(15deg) translate(-32px,-20px);}60%{transform:translate(0px,-1px) translate(32px,20px) rotate(-3deg) translate(-32px,-20px);}75%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}100%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}}.left{animation:left 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes left{0%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}30%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}35%{transform:translate(19.5px,31.5px) scale(1,0.08) translate(-19.5px,-31.5px);}43%{transform:translate(19.5px,31.5px) scale(1,0.08) translate(-19.5px,-31.5px);}48%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}100%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}}.right{animation:right 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes right{0%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}72%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}75%{transform:translate(29px,34.2px) scale(1,0.08) translate(-29px,-34.2px);}79%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}100%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}}.spin{animation:spin 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes spin{0%{transform:translate(32px,35px) rotate(0deg) translate(-32px,-35px);}15%{transform:translate(32px,35px) rotate(0deg) translate(-32px,-35px);}28%{transform:translate(32px,35px) rotate(-7deg) translate(-32px,-35px);}44%{transform:translate(32px,35px) rotate(-7deg) translate(-32px,-35px);}62%{transform:translate(32px,35px) rotate(3deg) translate(-32px,-35px);}76%{transform:translate(32px,35px) rotate(0deg) translate(-32px,-35px);}100%{transform:translate(32px,35px) rotate(0deg) translate(-32px,-35px);}}.eyes{animation:eyes 4s cubic-bezier(.33333,0,.66667,1) 1 both}@keyframes eyes{0%{transform:translate(0px,0px);}25%{transform:translate(1px,-0.8px);}44%{transform:translate(1px,-0.8px);}66%{transform:translate(0px,0px);}100%{transform:translate(0px,0px);}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.particles,.halo{opacity:0!important}}</style><g class="halo" transform="translate(32,35) scale(1,1) translate(-32,-35)" opacity="0"><circle cx="32" cy="35" r="32" fill="none" stroke="#9A4E12" stroke-width=".45"/></g><g fill="#9A4E12"></g><g class="whole" opacity="1"><g class="lift" transform="translate(0,0)"><g class="spin" transform="translate(32,35) rotate(0) translate(-32,-35)"><g class="squash" transform="translate(32,61.5) scale(1,1) translate(-32,-61.5)" fill="#161616"><g class="body" transform="translate(0,0)" opacity="1"><path fill-rule="evenodd" d="M10 35C10 39.7 19.8 43.5 32 43.5S54 39.7 54 35V53C54 57.7 44.2 61.5 32 61.5S10 57.7 10 53ZM10 46.5C10 51.2 19.8 55 32 55S54 51.2 54 46.5V49.5C54 54.2 44.2 58 32 58S10 54.2 10 49.5Z"/></g><g class="hat" transform="translate(0,0) translate(32,20) rotate(0) translate(-32,-20)"><ellipse cx="31" cy="29" rx="24" ry="8.2" transform="rotate(24 55 32)"/></g><g class="eyes" transform="translate(0,0)"><g class="left" transform="translate(19.5,31.5) scale(1,1) translate(-19.5,-31.5)"><ellipse cx="19.5" cy="31.5" rx="3.2" ry="4.4"/></g><g class="right" transform="translate(29,34.2) scale(1,1) translate(-29,-34.2)"><ellipse cx="29" cy="34.2" rx="3.2" ry="4.4"/></g></g></g></g></g></g><g transform="translate(59,52)"><circle r="6.5" fill="#E99532"/><g stroke="#161616" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0-3v4M0 3v.1"/></g></g></svg>