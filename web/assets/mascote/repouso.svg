<svg color="#161616" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-18 -24 100 100" role="img" aria-labelledby="title"><title id="title">Logo Em repouso — Vivo</title><style>g,ellipse{transform-box:view-box;transform-origin:0 0}.lift{animation:lift 4s cubic-bezier(.33333,0,.66667,1) infinite}@keyframes lift{0%{transform:translate(0px,0px);}40%{transform:translate(0px,-0.8px);}100%{transform:translate(0px,0px);}}.hat{animation:hat 4s cubic-bezier(.33333,0,.66667,1) infinite}@keyframes hat{0%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}45%{transform:translate(0px,-0.6px) translate(32px,20px) rotate(-1deg) translate(-32px,-20px);}100%{transform:translate(0px,0px) translate(32px,20px) rotate(0deg) translate(-32px,-20px);}}.left{animation:left 4s cubic-bezier(.33333,0,.66667,1) infinite}@keyframes left{0%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}38%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}41%{transform:translate(19.5px,31.5px) scale(1,0.06) translate(-19.5px,-31.5px);}44%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}100%{transform:translate(19.5px,31.5px) scale(1,1) translate(-19.5px,-31.5px);}}.right{animation:right 4s cubic-bezier(.33333,0,.66667,1) infinite}@keyframes right{0%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}38%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}41%{transform:translate(29px,34.2px) scale(1,0.06) translate(-29px,-34.2px);}44%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}100%{transform:translate(29px,34.2px) scale(1,1) translate(-29px,-34.2px);}}.squash{animation:squash 4s cubic-bezier(.33333,0,.66667,1) infinite}@keyframes squash{0%{transform:translate(32px,61.5px) scale(1,1) translate(-32px,-61.5px);}45%{transform:translate(32px,61.5px) scale(1.012,0.982) translate(-32px,-61.5px);}100%{transform:translate(32px,61.5px) scale(1,1) translate(-32px,-61.5px);}}.eyes{animation:eyes 4s cubic-bezier(.33333,0,.66667,1) infinite}@keyframes eyes{0%{transform:translate(0px,0px);}12%{transform:translate(0px,0px);}22%{transform:translate(2.8px,-0.5px);}38%{transform:translate(2.8px,-0.5px);}50%{transform:translate(0px,0px);}68%{transform:translate(-1.8px,0.3px);}80%{transform:translate(0px,0px);}100%{transform:translate(0px,0px);}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.particles,.halo{opacity:0!important}}</style><g class="halo" transform="translate(32,35) scale(1,1) translate(-32,-35)" opacity="0"><circle cx="32" cy="35" r="32" fill="none" stroke="#9A4E12" stroke-width=".45"/></g><g fill="#9A4E12"></g><g class="whole" opacity="1"><g class="lift" transform="translate(0,0)"><g class="spin" transform="translate(32,35) rotate(0) translate(-32,-35)"><g class="squash" transform="translate(32,61.5) scale(1,1) translate(-32,-61.5)" fill="#161616"><g class="body" transform="translate(0,0)" opacity="1"><path fill-rule="evenodd" d="M10 35C10 39.7 19.8 43.5 32 43.5S54 39.7 54 35V53C54 57.7 44.2 61.5 32 61.5S10 57.7 10 53ZM10 46.5C10 51.2 19.8 55 32 55S54 51.2 54 46.5V49.5C54 54.2 44.2 58 32 58S10 54.2 10 49.5Z"/></g><g class="hat" transform="translate(0,0) translate(32,20) rotate(0) translate(-32,-20)"><ellipse cx="31" cy="29" rx="24" ry="8.2" transform="rotate(24 55 32)"/></g><g class="eyes" transform="translate(0,0)"><g class="left" transform="translate(19.5,31.5) scale(1,1) translate(-19.5,-31.5)"><path d="M16.3 31.5q3.2 3 6.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g><g class="right" transform="translate(29,34.2) scale(1,1) translate(-29,-34.2)"><path d="M25.8 34.2q3.2 3 6.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g></g></g></g></g></g></svg>